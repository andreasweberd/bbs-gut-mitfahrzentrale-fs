name: Build Deployable Artifact (MySQL)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build & Package Artifact
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test_password
          MYSQL_DATABASE: bbs_mitfahrzentrale
          MYSQL_USER: bbs_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -uroot -proot_test_password" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "Using npm ci with package-lock.json"
            npm ci
          else
            echo "package-lock.json not found, falling back to npm install"
            npm install
          fi

      - name: 🔍 Lint & Typecheck
        run: npm run lint

      - name: 🗄️ Test MySQL Schema & Seed Migration
        run: |
          mysql -h 127.0.0.1 -P 3306 -u bbs_user -ptest_password bbs_mitfahrzentrale < schema.sql
          echo "✅ Schema.sql successfully verified against MySQL 8.0!"
          mysql -h 127.0.0.1 -P 3306 -u bbs_user -ptest_password -e "SELECT count(*) AS schueler_count FROM bbs_mitfahrzentrale.schueler;"
          mysql -h 127.0.0.1 -P 3306 -u bbs_user -ptest_password -e "SELECT count(*) AS eintraege_count FROM bbs_mitfahrzentrale.eintraege;"

      - name: 🏗️ Build Application (Frontend + Server Bundle)
        run: npm run build

      - name: 📦 Assemble Deployable Release Artifact
        run: |
          mkdir -p release-artifact
          # Copy compiled output
          cp -r dist release-artifact/
          # Copy database schema & docker orchestration
          cp schema.sql release-artifact/
          cp Dockerfile release-artifact/
          cp docker-compose.yml release-artifact/
          cp .dockerignore release-artifact/
          # Copy dependencies descriptor and configuration
          cp package.json release-artifact/
          [ -f package-lock.json ] && cp package-lock.json release-artifact/ || true
          cp .env.example release-artifact/
          cp README.md release-artifact/

          # Create a standalone archive
          tar -czf bbs-gut-rideshare-deployable.tar.gz -C release-artifact .
          zip -r bbs-gut-rideshare-deployable.zip release-artifact/

          mv bbs-gut-rideshare-deployable.tar.gz release-artifact/
          mv bbs-gut-rideshare-deployable.zip release-artifact/

          echo "Artifact structure:"
          ls -la release-artifact/

      - name: 🚀 Upload Artifact (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: bbs-gut-rideshare-deployable-artifact
          path: release-artifact/
          retention-days: 30

      - name: 📝 Output Deployment Summary
        run: |
          echo "### 🚀 Deployable Artifact Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **TypeScript & React** | ✅ Passed | Built with Vite & React 19 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Server Bundle** | ✅ Passed | Bundled to \`dist/server.cjs\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **MySQL 8.0 Schema** | ✅ Verified | \`schema.sql\` tested with seed records |" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Support** | ✅ Ready | Multi-stage Dockerfile + Compose |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### How to deploy on your server:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download \`bbs-gut-rideshare-deployable-artifact\` from the Actions summary." >> $GITHUB_STEP_SUMMARY
          echo "2. Extract the archive onto your target server." >> $GITHUB_STEP_SUMMARY
          echo "3. Run \`docker compose up -d\` OR run \`npm ci --omit=dev && node dist/server.cjs\` with your MySQL credentials in \`.env\`." >> $GITHUB_STEP_SUMMARY
